services:
  # ========== POSTGRESQL DATABASE ==========
  # NOTE: Kept at postgres:16 per user request. Latest LTS is postgres:17.
  postgres:
    image: postgres:16
    container_name: medusa_postgres
    restart: unless-stopped
    mem_limit: 256M
    cpus: "0.5"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ========== postgres-backup-s3 ==========
  backup:
    image: eeshugerman/postgres-backup-s3:16
    restart: unless-stopped
    mem_limit: 128M
    cpus: "0.3"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SCHEDULE: "@weekly" # optional
      BACKUP_KEEP_DAYS: 7 # optional
      PASSPHRASE: ${PASSPHRASE} # optional
      S3_ENDPOINT: ${ARVAN_ENDPOINT}
      S3_REGION: ${ARVAN_REGION}
      S3_ACCESS_KEY_ID: ${ARVAN_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${ARVAN_SECRET_KEY}
      S3_BUCKET: ${ARVAN_BACKUP_BUCKET}
      S3_PREFIX: backup
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - medusa_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ========== pgbackweb (Effortless PostgreSQL backups) ==========
  # pgbackweb:
  #   image: eduardolat/pgbackweb:latest
  #   restart: unless-stopped
  #   mem_limit: 128M
  #   cpus: "0.3"
  #   # Set in Caddyfile
  #   # ports:
  #   #   - "8085:8085" # Access the web interface at http://localhost:8085
  #   environment:
  #     # Optional environment variables are ignored, see the configuration section below for more details
  #     PBW_ENCRYPTION_KEY: ${PGBACKWEB_SECRET_KEY} # Change this to a strong key
  #     PBW_POSTGRES_CONN_STRING: "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/pgbackweb?sslmode=disable"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - medusa_network
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "5"

  # ========== dbx (PostgreSQL DBMS) ==========
  dbx:
    image: t8y2/dbx:latest
    container_name: dbms
    restart: unless-stopped
    mem_limit: 128M
    cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
    pull_policy: always
    environment:
      DBX_PASSWORD: ${DBX_PASSWORD}
    ports:
      - "4224:4224"
    networks:
      - medusa_network
    volumes:
      - dbx-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ========== REDIS (Cache & Queue) ==========
  redis:
    image: redis:8.8-alpine
    container_name: medusa_redis
    restart: unless-stopped
    mem_limit: 128M
    cpus: "0.3"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - medusa_network
    healthcheck:
      # FIX: must pass -a flag; without it the check always returned healthy
      # even when the server required a password and was rejecting connections.
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ========== MINIO (S3-compatible Storage) ==========
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3901:3901"
    networks:
      - medusa_network
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-minioadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-minioadmin}
      - RUSTFS_REGION=${RUSTFS_REGION:-us-east-1}
      - RUSTFS_CONSOLE_ADDRESS=${RUSTFS_CONSOLE_ADDRESS:-http://rustfs:3901}
      - RUSTFS_ADDRESS=${RUSTFS_ENDPOINT:-http://rustfs:3900}
      - RUSTFS_CORS_ALLOWED_ORIGINS=${RUSTFS_CORS_ALLOWED_ORIGINS:-"https://tabeshelecshop.ir"}
    volumes:
      - rustfs_data:/data # CHANGED: Use named volume instead of bind mount
    command: server /data --address ":3900" --console-address ":3901"
    mem_limit: 256M
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3900/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ========== MEDUSA BACKEND ==========
  medusa:
    image: registry.tabeshelecshop.ir/medusa:v8
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # meilisearch:
      #   condition: service_healthy
      rustfs:
        condition: service_healthy
    ports:
      - "9000:9000"
      - "5173:5173"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # S3_URL: http://minio:9000
      # S3_BUCKET: medusa
      # S3_REGION: us-east-1
      # S3_ACCESS_KEY_ID: ${MINIO_USER}
      # S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      S3_ENDPOINT: ${RUSTFS_ENDPOINT}
      S3_FILE_URL: ${RUSTFS_FILE_URL}
      S3_BUCKET: ${RUSTFS_BUCKET}
      S3_REGION: ${RUSTFS_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY}
    env_file:
      - apps/backend/.env
    # volumes:
    # Mount your local config file into the container
    # - ./apps/backend/medusa-config.js:/app/medusa-config.js:ro
    networks:
      - medusa_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:9000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ========== STOREFRONT (Next.js) ==========
  # Uncomment and update the image name when your storefront image is ready.
  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION}
        NEXT_PUBLIC_DEFAULT_REGION_ID: ${NEXT_PUBLIC_DEFAULT_REGION_ID}
        NEXT_PUBLIC_DEFAULT_STORE_ID: ${NEXT_PUBLIC_DEFAULT_STORE_ID}
        NEXT_PUBLIC_INCREDIBLE_OFFER_HANDLE: ${NEXT_PUBLIC_INCREDIBLE_OFFER_HANDLE}
        NEXT_PUBLIC_SUBSCRIPTION_PRODUCT_SLUG: ${NEXT_PUBLIC_SUBSCRIPTION_PRODUCT_SLUG}
        NEXT_PUBLIC_FEATURE_SEARCH_ENABLED: ${NEXT_PUBLIC_FEATURE_SEARCH_ENABLED}
        NEXT_PUBLIC_SEARCH_ENDPOINT: ${NEXT_PUBLIC_SEARCH_ENDPOINT}
        NEXT_PUBLIC_SEARCH_API_KEY: ${NEXT_PUBLIC_SEARCH_API_KEY}
        NEXT_PUBLIC_EMAIL_DOMAIN: ${NEXT_PUBLIC_EMAIL_DOMAIN}
        NEXT_PUBLIC_IMAGE_HOST_ADDRESS: ${NEXT_PUBLIC_IMAGE_HOST_ADDRESS}
    image: registry.tabeshelecshop.ir/storefront:v8
    container_name: medusa_storefront
    restart: unless-stopped
    mem_limit: 768M
    cpus: "0.5"
    depends_on:
      medusa:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://medusa:9000
    env_file:
      - apps/storefront/.env
    networks:
      - medusa_network
    # healthcheck:
    #   test: ["CMD", "nc", "-z", "localhost", "8000"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ========== PRIVATE DOCKER REGISTRY ==========
  registry:
    image: registry:3
    container_name: docker_registry
    restart: unless-stopped
    mem_limit: 256M
    cpus: "0.3"
    ports:
      - "5000:5000"
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry Realm"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - ./registry/auth:/auth:ro
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - registry_data:/var/lib/registry
    networks:
      - medusa_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --server-response --spider -q http://localhost:5000/v2/ 2>&1 | grep -qE 'HTTP/[0-9.]+ (200|401)'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ========== DOCKER REGISTRY UI ==========

  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry_ui
    restart: unless-stopped
    environment:
      - REGISTRY_TITLE=My Registry
      - DELETE_IMAGES=true
      - SINGLE_REGISTRY=true
      - NGINX_PROXY_PASS_URL=http://registry:5000
    networks:
      - medusa_network

  # ========== CADDY REVERSE PROXY ==========
  caddy:
    image: caddy:2.11.3-alpine
    container_name: caddy_proxy
    restart: unless-stopped
    mem_limit: 128M
    cpus: "0.3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - medusa_network
    depends_on:
      medusa:
        condition: service_healthy
      # registry:
      #   condition: service_healthy
      # storefront:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

# ========== VOLUMES ==========
volumes:
  postgres_data:
    name: medusa_postgres_data
  redis_data:
    name: medusa_redis_data
  # meilisearch_data:
  #   name: medusa_meilisearch_data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  registry_data:
    name: docker_registry_data
  rustfs_data:
    name: medusa_rustfs_data
  dbx-data:
    name: dbx_data

# ========== NETWORKS ==========
networks:
  medusa_network:
    name: medusa_network
    driver: bridge
